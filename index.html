<!DOCTYPE html>
<html lang="en">
<head>

    <title>MyVideoNet - Watch & Share</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">🎥 MyVideoNet</div>
    </header>

    <div class="main-layout">
        <div class="auth-container">
            <div class="card">
                <h2>Join MyVideoNet</h2>
                <!-- PASTE YOUR FORMSPREE LINK IN THE ACTION BOX BELOW -->

                    <input type="password" name="password" placeholder="Choose Password" required>
                    <button type="submit">Create Account</button>
                </form>
            </div>
        </div>
    </div>
</body>
